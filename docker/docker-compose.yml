# =============================================================================
# Umo Editor 全栈编排（引擎 + 瘦客户端示例）
# -----------------------------------------------------------------------------
# 一键启动：docker compose -f docker/docker-compose.yml up -d --build
#
# 启动后：
#   引擎容器  :9999  → 编辑器引擎（/oes/embed /oes/collab /oes/api/token /oes/api/convert）
#   demo 容器  :9998  → 瘦客户端示例（登录 / 文档列表 / 编辑器页）
#   浏览器访问    → http://localhost:9998/oes/
#
# 数据卷（持久化）：
#   umo-collab-data → /app/collab-server/data （引擎：协同文档 Yjs 二进制）
#   umo-demo-data   → /app/server/data        （demo：文档元数据 SQLite + 回传文件）
# =============================================================================

services:
  umo-editor-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: umo-editor-engine:latest
    container_name: umo-editor-engine
    ports:
      - "9999:9999"
    environment:
      # JWT 密钥（HS256）。生产环境务必改成强随机值，可在 .env 或命令行覆盖
      JWT_SECRET: ${JWT_SECRET:-umo-collab-secret-dev-only}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      # API Key：业务后端调 /api/token 时必带 header x-api-key。
      # 留空时为 dev 无鉴权模式；生产务必设为强随机值
      UMO_API_KEY: ${UMO_API_KEY:-}
    volumes:
      # 协同内容（Yjs 文档二进制）
      - umo-collab-data:/app/collab-server/data
    restart: unless-stopped
    healthcheck:
      # 健康检查走引擎 /oes/api/health（由 collab-server 提供，nginx 反代）
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:9999/oes/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  umo-editor-demo:
    build:
      context: ..
      dockerfile: demo/docker/Dockerfile
    image: umo-editor-demo:latest
    container_name: umo-editor-demo
    ports:
      - "9998:9998"
    environment:
      # demo-server → 引擎（容器内通信，用 compose 服务名，带 /oes 应用前缀）
      UMO_ENGINE_URL: http://umo-editor-engine:9999/oes
      # 与引擎的 UMO_API_KEY 保持一致（代理签 JWT 时带）
      UMO_API_KEY: ${UMO_API_KEY:-}
      # 浏览器访问引擎的地址（写入前端 config.js，iframe 用，带 /oes 前缀）。
      # 默认 localhost:9999/oes 适合本机部署；远程部署改成 http://<服务器IP>:9999/oes
      UMO_ENGINE_PUBLIC_URL: ${UMO_ENGINE_PUBLIC_URL:-http://localhost:9999/oes}
    volumes:
      # 文档元数据（SQLite）+ 接收的导出文件
      - umo-demo-data:/app/server/data
    depends_on:
      - umo-editor-engine
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:9998/oes/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  umo-collab-data:
  umo-demo-data:

