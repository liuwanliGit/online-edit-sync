# =============================================================================
# Umo Editor 引擎镜像编排（私有化交付）
# -----------------------------------------------------------------------------
# 一键启动：docker compose -f docker/docker-compose.yml up -d --build
# 访问：    http://localhost:9999/embed?doc=test&token=<jwt>
#
# 数据卷（持久化）：
#   umo-collab-data → /app/collab-server/data （协同文档 Yjs 二进制）
# =============================================================================

services:
  umo-editor-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: umo-editor-engine:latest
    container_name: umo-editor-engine
    ports:
      - "9999:9999"
    environment:
      # JWT 密钥（HS256）。生产环境务必改成强随机值，可在 .env 或命令行覆盖
      JWT_SECRET: ${JWT_SECRET:-umo-collab-secret-dev-only}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      # API Key：业务后端调 /api/token 时必带 header x-api-key。
      # 留空时为 dev 无鉴权模式；生产务必设为强随机值
      UMO_API_KEY: ${UMO_API_KEY:-}
    volumes:
      # 协同内容（Yjs 文档二进制）
      - umo-collab-data:/app/collab-server/data
    restart: unless-stopped
    healthcheck:
      # 健康检查走引擎 /api/health（由 collab-server 提供，nginx 反代）
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:9999/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  umo-collab-data:
