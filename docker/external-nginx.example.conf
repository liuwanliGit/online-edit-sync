# =============================================================================
# Umo Editor 外层反代示例（单域名 /oes 子路径部署）
# -----------------------------------------------------------------------------
# 适用场景：用一台 nginx 把 demo(9998) 和引擎(9999) 反代到同一域名的 /oes 子路径下，
#           而不是直接暴露两个端口。这是「把编辑器嵌进已有业务系统」最常见的拓扑。
#
# 前缀设计（demo 与引擎按前缀彻底分离）：
#   · demo（页面/静态资源/业务 API）固定挂 /oes/demo/ 前缀
#   · 引擎前端固定挂 /oes/embed/ 前缀；引擎 API/WS 挂 /oes/api/*、/oes/collab
#   · 两套 /assets/（/oes/demo/assets/ 与 /oes/embed/assets/）互不冲突
#   · 外层 nginx 只需「整段透传」，无需剥前缀（proxy_pass 不带尾斜杠）
#
# 假设拓扑（前缀分流）：
#   https://your-domain/oes/demo/  （demo 页面、静态资源、业务 API）  →  demo 容器  :9998
#   https://your-domain/oes/*      （embed / collab / api 等引擎专属） →  引擎容器  :9999
#
# 分流规则：
#   · location /oes/demo/  → demo 容器（单独挑出，优先匹配）
#   · location /oes/collab → 引擎容器（WebSocket，需 Upgrade/Connection 头，必须单列）
#   · location ~ /comments/stream$ → 引擎容器（评论 SSE，需关缓冲，必须单列正则）
#   · location /oes/       → 引擎容器（兜底：iframe 着陆页 + 静态资源 + 普通 API）
#
# 部署步骤：
#   1. 启动引擎与 demo 容器（docker compose -f docker/docker-compose.yml up -d）
#   2. 复制本文件到宿主机 nginx（如 /etc/nginx/conf.d/umo.conf），按实际域名/IP 改 upstream
#   3. 设置 demo 容器环境变量 UMO_ENGINE_PUBLIC_URL=https://your-domain/oes
#      （指向本 nginx 的 /oes，让 iframe 加载 https://your-domain/oes/embed）
#   4. reload nginx: nginx -s reload
#
# 技术要点：
#   · proxy_pass 不带尾斜杠（http://upstream）→ 整段路径透传，容器收到 /oes/...，
#     与容器内 nginx 的 location 完全匹配，无需剥前缀。
#   · WebSocket 的 /oes/collab 必须单独 location 并显式设置 Upgrade/Connection 头。
#   · 评论 SSE 的 /oes/api/documents/:docId/comments/stream 必须单独 location 关缓冲，
#     否则事件会被 nginx 攒批后端、空闲 60s 被掐断。
#   · 静态资源缓存由容器内 nginx 处理，这里只做透传。
# =============================================================================

# WebSocket 升级映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 后端容器（按实际部署改 IP/端口；同机可用 127.0.0.1，跨机用宿主机 IP 或内网域名）
upstream umo_engine {
    server 127.0.0.1:9999;   # 引擎容器
}
upstream umo_demo {
    server 127.0.0.1:9998;   # demo 容器
}

server {
    listen 80;
    # listen 443 ssl;
    # ssl_certificate     /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
    server_name your-domain.example.com;

    # 大文件导出（docx 转换含 base64 图片，放宽到 20MB）
    client_max_body_size 20m;

    # ---- 根路径跳转到 demo 入口 ----
    location = / {
        return 302 /oes/demo/;
    }

    # ---- demo：页面 + 静态资源 + 业务 API（整段转 demo 容器）----
    location /oes/demo/ {
        proxy_pass http://umo_demo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 引擎：协同 WebSocket（必须单独 location 处理升级头）----
    location /oes/collab {
        proxy_pass http://umo_engine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;      # 长连接，避免空闲 WS 被断开
        proxy_send_timeout 86400s;
    }

    # ---- 引擎：评论 SSE（正则优先匹配，关缓冲，避免事件被攒批/掐断）----
    # 路径：/oes/api/documents/:docId/comments/stream
    location ~ ^/oes/api/documents/[^/]+/comments/stream$ {
        proxy_pass http://umo_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- 引擎兜底：/oes/ 其余全部（iframe 着陆页 + 静态资源 + 普通 API）----
    # 包括 /oes/embed、/oes/embed/assets/*、/oes/api/token、/oes/api/health、
    # /oes/api/convert/*、/oes/api/documents/:docId/comments（评论 REST，非 SSE）、
    # /oes/api/comments/:id 等。client_max_body_size 已在 server 块设为 20m。
    location /oes/ {
        proxy_pass http://umo_engine;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
