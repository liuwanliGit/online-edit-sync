# =============================================================================
# Umo Editor 外层反代示例（单域名 /oes 子路径部署）
# -----------------------------------------------------------------------------
# 适用场景：用一台 nginx 把 demo(9998) 和引擎(9999) 反代到同一域名的 /oes 子路径下，
#           而不是直接暴露两个端口。这是「把编辑器嵌进已有业务系统」最常见的拓扑。
#
# 核心简化：应用前缀 /oes 已固定烧进镜像（vite base + 容器 nginx location 都用 /oes），
#           外层 nginx 只需「整段透传」，无需剥前缀（proxy_pass 不带尾斜杠）。
#
# 假设拓扑：
#   https://your-domain/oes/embed, /collab, /api/convert, /api/token  →  引擎容器 :9999
#   https://your-domain/oes/  （页面、静态资源、业务 /api/documents 等）   →  demo 容器  :9998
#
# 区分规则（nginx 最长前缀匹配，把引擎专属路径放前面优先命中）：
#   · /oes/embed、/oes/collab、/oes/api/convert、/oes/api/token、/oes/api/health
#       → 引擎容器（这些是引擎独有的端点）
#   · 其余 /oes/（含 /oes/api/documents 等业务 API、/oes/assets/、/oes/index.html）
#       → demo 容器
#
# 部署步骤：
#   1. 启动引擎与 demo 容器（docker compose -f docker/docker-compose.yml up -d）
#   2. 复制本文件到宿主机 nginx（如 /etc/nginx/conf.d/umo.conf），按实际域名/IP 改 upstream
#   3. 设置 demo 容器环境变量 UMO_ENGINE_PUBLIC_URL=https://your-domain/oes
#      （指向本 nginx 的 /oes，让 iframe 加载 https://your-domain/oes/embed）
#   4. reload nginx: nginx -s reload
#
# 技术要点：
#   · proxy_pass 不带尾斜杠（http://upstream）→ 整段路径透传，容器收到 /oes/...，
#     与容器内 nginx 的 location /oes/ 完全匹配，无需剥前缀。
#   · WebSocket 的 /oes/collab 必须单独加 location 并显式设置 Upgrade/Connection 头。
#   · 静态资源缓存由容器内 nginx 处理，这里只做透传。
# =============================================================================

# WebSocket 升级映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 后端容器（按实际部署改 IP/端口；同机可用 127.0.0.1，跨机用宿主机 IP 或内网域名）
upstream umo_engine {
    server 127.0.0.1:9999;   # 引擎容器
}
upstream umo_demo {
    server 127.0.0.1:9998;   # demo 容器
}

server {
    listen 80;
    # listen 443 ssl;
    # ssl_certificate     /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
    server_name your-domain.example.com;

    # 大文件导出（docx 转换含 base64 图片，放宽到 20MB）
    client_max_body_size 20m;

    # =========================================================================
    # 引擎专属路径（优先匹配，转给引擎容器 :9999）
    # proxy_pass 不带尾斜杠 → 整段透传 /oes/...，容器内 nginx 认 /oes 前缀
    # =========================================================================

    # 协同 WebSocket：必须单独 location 处理升级头
    location /oes/collab {
        proxy_pass http://umo_engine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 引擎 iframe 着陆页
    location = /oes/embed {
        proxy_pass http://umo_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 引擎静态资源（/oes/assets/...）—— 引擎容器提供
    # 注意：demo 也有 /oes/assets/，但通常不会和引擎在同一域名下同时被请求；
    # 若担心冲突，可把引擎静态资源 location 改更精确（本示例保持简单透传到 demo）
    # 这里把 /oes/assets/ 也归到引擎，因为 iframe 页加载的是引擎的 assets

    # 引擎 API：转换、令牌、健康检查（精确匹配，避免和 demo 的 /oes/api/ 冲突）
    location = /oes/api/token {
        proxy_pass http://umo_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /oes/api/health {
        proxy_pass http://umo_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /oes/api/convert/ {
        proxy_pass http://umo_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # =========================================================================
    # demo（页面 / 静态资源 / 业务 API）  通用 /oes/ 兜底 → demo 容器 :9998
    # =========================================================================
    # 其余所有 /oes/ 请求（/oes/、/oes/login、/oes/documents、/oes/api/documents 等）
    # 都转给 demo 容器。proxy_pass 不带尾斜杠 → 整段透传。
    location /oes/ {
        proxy_pass http://umo_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # （可选）如希望访问域名根时跳转到 demo
    location = / {
        return 302 /oes/;
    }
}
