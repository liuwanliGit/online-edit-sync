# =============================================================================
# Umo Editor 引擎 nginx 配置（容器内）
# -----------------------------------------------------------------------------
# 应用统一挂在 /oes 前缀下，外部 nginx 透传即可，无需剥前缀。
#
# 职责：
#   1. 提供 /oes/embed 纯编辑器页（iframe 着陆页）
#   2. 反代协同服务 /oes/api/token、/oes/api/health、/oes/collab(WS) → 127.0.0.1:4000
#   3. 反代转换服务 /oes/api/convert/                          → 127.0.0.1:4002
#   4. （二阶段）反代读文档服务 /oes/api/doc/                    → 127.0.0.1:4003
#
# 所有 API/WS 经 rewrite 剥掉 /oes 前缀，后端收到的是无前缀路径（/api/*、/collab），零改动。
# embed 前端是同源服务，WS 地址由 location.host + base-path.js 推导（无需运行时全局变量注入）。
# =============================================================================

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志输出到 stdout/stderr，docker logs 可见
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # WebSocket 升级映射：$http_upgrade 为 websocket 时 $connection_upgrade=upgrade，
    # 否则 close（同时服务 HTTP token 端点时不会误升级普通请求）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile        on;
    keepalive_timeout 65;

    # gzip 压缩静态资源
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 上游服务（容器内进程）
    upstream collab_backend {
        server 127.0.0.1:4000;
    }
    upstream convert_backend {
        server 127.0.0.1:4002;
    }
    # 二阶段启用：read-server
    # upstream read_backend {
    #     server 127.0.0.1:4003;
    # }

    server {
        listen 9999 default_server;
        listen [::]:9999 default_server;
        server_name _;

        # 前端静态资源（embed 构建产物）
        root /app/public;
        index index.html;

        # ---- 根访问跳转到 /oes/embed ----
        location = / {
            return 302 /oes/embed;
        }

        # ---- /oes/embed 入口（canonical iframe 着陆页）----
        # 保留 query string（doc/token/mode/lang），rewrite 到 /index.html
        location = /oes/embed {
            rewrite ^ /oes/index.html last;
        }

        # ---- 协同服务：HTTP token 签发端点（API Key 收口）----
        # 业务后端调：GET /api/token?name=&doc=&role=  header: x-api-key
        location = /oes/api/token {
            rewrite ^/oes(/.*)$ $1 break;
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- 健康检查（collab-server 提供 /api/health）----
        location = /oes/api/health {
            rewrite ^/oes(/.*)$ $1 break;
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---- 文档转换服务（HTML→docx）----
        # 必须放在 /oes/api/ 之前：最长前缀匹配优先命中 /oes/api/convert/，转给 convert-server。
        # body 可能含 base64 图片，放宽到 20MB。
        location /oes/api/convert/ {
            rewrite ^/oes(/.*)$ $1 break;
            proxy_pass http://convert_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20m;
        }

        # ---- 评论 REST + SSE API → collab-server(:4000) ----
        # 无鉴权（同源信任）。SSE 长连接需关缓冲 + 长超时。
        # 两类路径：
        #   /oes/api/documents/:docId/comments(/*|/stream)  → 文档级评论（列表/新建/批量删除/SSE）
        #   /oes/api/comments/:id(/replies)                 → 单条评论（PATCH/DELETE/回复）
        location /oes/api/documents/ {
            rewrite ^/oes(/.*)$ $1 break;
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE 需要关缓冲，否则事件会被缓存导致实时性丢失
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            chunked_transfer_encoding on;
        }
        location /oes/api/comments/ {
            rewrite ^/oes(/.*)$ $1 break;
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- （二阶段）后端读文档服务：/api/doc/:id/(html|text|json|excerpt）----
        # location /oes/api/doc/ {
        #     rewrite ^/oes(/.*)$ $1 break;
        #     proxy_pass http://read_backend;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        # }

        # ---- 协同服务：WebSocket（Yjs 实时同步）----
        # Hocuspocus 不校验 WS path（noServer 模式手动接管 upgrade），任意前缀均可。
        location /oes/collab {
            rewrite ^/oes(/.*)$ $1 break;
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;
            # WebSocket 必需的升级头（map 已按 $http_upgrade 自动取值）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 协同长连接，关闭超时（默认 60s 会断开空闲 WS）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ---- SPA 入口 + 静态资源 ----
        # embed 构建产物放在 /app/public/oes/ 下（Dockerfile COPY 到此），
        # URL /oes/assets/x.js 用 root /app/public 自然映射到 /app/public/oes/assets/x.js，
        # 无需 alias/rewrite（alias 与 try_files/rewrite 有已知兼容问题，用子目录最干净）。
        location /oes/ {
            root /app/public;
            index index.html;
            try_files $uri $uri/ /oes/index.html;
        }
    }
}
