# =============================================================================
# Umo Editor 全栈 nginx 配置（容器内）
# -----------------------------------------------------------------------------
# 职责：
#   1. 提供前端静态资源（demo/dist）
#   2. SPA 路由兜底（vue-router history 模式）
#   3. 反代文档管理后端 /api/documents/*    → 127.0.0.1:4001
#   4. 反代文档转换服务 /api/convert/*      → 127.0.0.1:4002（HTML→docx）
#   5. 反代协同服务 /collab/api/token       → 127.0.0.1:4000（HTTP，签 JWT）
#   6. 反代协同服务 /collab (WebSocket)     → 127.0.0.1:4000（Yjs 实时同步）
#   7. 向 index.html 注入运行时全局变量（前端据此连后端，零源码改动）
#
# 注入的全局变量（动态，基于浏览器当前 host）：
#   window.__UMO_API_URL__    = ''              → fetch 同站相对路径 /api/documents
#   window.__UMO_COLLAB_URL__ = '<当前host>/collab' → WS 与 /api/token 共用此前缀
# =============================================================================

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志输出到 stdout/stderr，docker logs 可见
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # WebSocket 升级映射：$http_upgrade 为 websocket 时 $connection_upgrade=upgrade，
    # 否则 close（同时服务 HTTP token 端点时不会误升级普通请求）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile        on;
    keepalive_timeout 65;

    # gzip 压缩静态资源
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 上游服务（容器内进程）
    upstream collab_backend {
        server 127.0.0.1:4000;
    }
    upstream demo_backend {
        server 127.0.0.1:4001;
    }
    upstream convert_backend {
        server 127.0.0.1:4002;
    }

    server {
        listen 9999 default_server;
        listen [::]:9999 default_server;
        server_name _;

        # 前端静态资源
        root /app/public;
        index index.html;

        # ---- 注入运行时配置（仅 index.html）----
        # 用一段动态 JS 根据 location 拼出绝对地址。
        # 注意：前端 api.js / collab-config.js 用 if(window.__UMO_*__) 真值判断，
        # 空字符串会被当作未设置而回退到 localhost 兜底，因此必须注入非空绝对地址。
        #   __UMO_API_URL__    = http(s)://<host>:9999  → fetch /api/documents（同站）
        #   __UMO_COLLAB_URL__ = ws(s)://<host>:9999/collab → WS + /api/token 共用前缀
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            sub_filter_once on;
            sub_filter '</title>' '</title><script>(function(){try{var L=window.location,h=(L.protocol==="https:"?"https://":"http://")+L.host;window.__UMO_API_URL__=h;window.__UMO_COLLAB_URL__=(L.protocol==="https:"?"wss://":"ws://")+L.host+"/collab";}catch(e){}})();</script>';
            sub_filter_types text/html;
        }

        # ---- 文档转换服务（HTML→docx）----
        # 必须放在 /api/ 之前：最长前缀匹配会优先命中 /api/convert/，转给 convert-server（:4002）。
        # body 可能含 base64 图片，放宽到 20MB。
        location /api/convert/ {
            proxy_pass http://convert_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20m;
        }

        # ---- 文档管理后端 REST ----
        # demo 后端原生路由是 /api/documents，nginx 透传不改路径
        location /api/ {
            proxy_pass http://demo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- 协同服务：HTTP token 签发端点 ----
        # 前端 fetch /collab/api/token，rewrite 去掉 /collab 前缀后转给 collab-server（其原生路由是 /api/token）
        location = /collab/api/token {
            rewrite ^/collab(/api/token)$ $1 break;
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- 协同服务：WebSocket（Yjs 实时同步）----
        # Hocuspocus 不校验 WS path（noServer 模式手动接管 upgrade），任意前缀均可。
        # 实际只有 WS 连接会命中这里（/collab/api/token 已被上面的精确 location 拦走）；
        # 偶有的非 WS 请求会被透传给 Hocuspocus 的 HTTP 层兜底处理。
        location /collab {
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;
            # WebSocket 必需的升级头（map 已按 $http_upgrade 自动取值）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 协同长连接，关闭超时（默认 60s 会断开空闲 WS）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ---- SPA 路由兜底（vue-router history 模式）----
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存（带 hash 的文件名可长期缓存）
        location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
