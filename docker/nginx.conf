# =============================================================================
# Umo Editor 引擎 nginx 配置（容器内）
# -----------------------------------------------------------------------------
# 职责：
#   1. 提供 /embed 纯编辑器页（iframe 着陆页，根路径也返回它）
#   2. 反代协同服务 /api/token、/api/health、/collab(WS)  → 127.0.0.1:4000
#   3. 反代转换服务 /api/convert/                          → 127.0.0.1:4002
#   4. （二阶段）反代读文档服务 /api/doc/                    → 127.0.0.1:4003
#
# 引擎不含 demo 前端 / demo-server / 登录页 / 文档列表（那些是业务系统自己的职责）。
# embed 前端是同源服务，WS 地址由 location.host 推导（无需运行时全局变量注入）。
# =============================================================================

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志输出到 stdout/stderr，docker logs 可见
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # WebSocket 升级映射：$http_upgrade 为 websocket 时 $connection_upgrade=upgrade，
    # 否则 close（同时服务 HTTP token 端点时不会误升级普通请求）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile        on;
    keepalive_timeout 65;

    # gzip 压缩静态资源
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 上游服务（容器内进程）
    upstream collab_backend {
        server 127.0.0.1:4000;
    }
    upstream convert_backend {
        server 127.0.0.1:4002;
    }
    # 二阶段启用：read-server
    # upstream read_backend {
    #     server 127.0.0.1:4003;
    # }

    server {
        listen 9999 default_server;
        listen [::]:9999 default_server;
        server_name _;

        # 前端静态资源（embed 构建产物）
        root /app/public;
        index index.html;

        # ---- /embed 入口（canonical iframe 着陆页）----
        # 保留 query string（doc/token/mode/lang），rewrite 到 index.html
        location = /embed {
            rewrite ^ /index.html last;
        }

        # ---- 协同服务：HTTP token 签发端点（API Key 收口）----
        # 业务后端调：GET /api/token?name=&doc=&role=  header: x-api-key
        location = /api/token {
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- 健康检查（collab-server 提供 /api/health）----
        location = /api/health {
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---- 文档转换服务（HTML→docx）----
        # 必须放在 /api/ 之前：最长前缀匹配优先命中 /api/convert/，转给 convert-server。
        # body 可能含 base64 图片，放宽到 20MB。
        location /api/convert/ {
            proxy_pass http://convert_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20m;
        }

        # ---- （二阶段）后端读文档服务：/api/doc/:id/(html|text|json|excerpt）----
        # location /api/doc/ {
        #     proxy_pass http://read_backend;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        # }

        # ---- 协同服务：WebSocket（Yjs 实时同步）----
        # Hocuspocus 不校验 WS path（noServer 模式手动接管 upgrade），任意前缀均可。
        location /collab {
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;
            # WebSocket 必需的升级头（map 已按 $http_upgrade 自动取值）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 协同长连接，关闭超时（默认 60s 会断开空闲 WS）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ---- 根路径返回 /embed（非 demo 登录页）----
        # 业务系统可直接用根地址或 /embed 作为 iframe src
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存（带 hash 的文件名可长期缓存）
        location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
