# =============================================================================
# Umo Editor 引擎进程管理配置（supervisor）
# -----------------------------------------------------------------------------
# 托管 3 个进程（不再有 demo-server）：
#   - collab-server  （priority=10，最先起，:4000 Yjs 协同 + JWT + /api/health）
#   - convert-server （priority=20，:4002 HTML→docx 转换）
#   - nginx          （priority=30，最后起，依赖上面两个 node 服务）
# 日志全部输出到 stdout/stderr，docker logs 可见。
# =============================================================================

[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null              # 不写文件，避免容器内日志膨胀
logfile_maxbytes=0

[program:collab-server]
command=node /app/collab-server/server.js
directory=/app/collab-server
# PORT/DB_PATH 固定；JWT_SECRET/JWT_EXPIRES_IN/UMO_API_KEY 从容器环境继承
environment=PORT="4000",DB_PATH="/app/collab-server/data/collab.db"
autostart=true
autorestart=true
startsecs=2
startretries=5
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:convert-server]
command=node /app/convert-server/server.js
directory=/app/convert-server
environment=PORT="4002"
autostart=true
autorestart=true
startsecs=2
startretries=5
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
