# =============================================================================
# Umo Editor 瘦客户端示例 nginx 配置（容器内）
# -----------------------------------------------------------------------------
# 应用统一挂在 /oes 前缀下，外部 nginx 透传即可，无需剥前缀。
#
# 职责：
#   1. 提供 demo 前端静态资源（/oes/ 前缀下，Vue Router history 兜底）
#   2. 反代业务后端：/oes/api/ → demo-server(:4001)（内部剥前缀，后端收到 /api/）
#
# 引擎（/oes/embed /oes/collab /oes/api/token 等）不在本容器，前端 iframe 直接指向引擎地址
# （由 config.js 的 engineUrl 指定，浏览器加载）。
# =============================================================================

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志输出到 stdout/stderr，docker logs 可见
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile        on;
    keepalive_timeout 65;

    # gzip 压缩静态资源
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 上游：demo 后端（容器内进程）
    upstream demo_backend {
        server 127.0.0.1:4001;
    }

    server {
        listen 9998 default_server;
        listen [::]:9998 default_server;
        server_name _;

        # ---- 根访问跳转到 /oes/ ----
        location = / {
            return 302 /oes/;
        }

        # ---- 反代 demo 后端：/oes/api/* ----
        # 文档元数据 / 代理签 JWT / 接收导出文件 / 健康检查 / 评论 CRUD
        # rewrite 剥掉 /oes 前缀，demo-server 收到的是 /api/*（后端零改动）
        # 导出回传可能含文件，放宽 body 大小
        location /oes/api/ {
            rewrite ^/oes(/.*)$ $1 break;
            proxy_pass http://demo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20m;
        }

        # ---- SSE 评论推送：/oes/api/documents/:docId/comments/stream ----
        # 正则 location 优先级高于上面的前缀 location；SSE 必须关缓冲 + 长超时，
        # 否则事件会被 nginx 攒一批再发，且空闲 60s 会被掐断。
        location ~ ^/oes/api/documents/[^/]+/comments/stream$ {
            rewrite ^/oes(/.*)$ $1 break;
            proxy_pass http://demo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            chunked_transfer_encoding on;
        }

        # ---- config.js 不缓存（部署后改地址立即生效）----
        # config.js 在 /app/public/oes/config.js，root 自然映射，无需 alias
        location = /oes/config.js {
            root /app/public;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---- SPA 入口 + 静态资源 ----
        # 前端构建产物放在 /app/public/oes/ 下（Dockerfile COPY 到此），
        # URL /oes/assets/x.js 用 root /app/public 自然映射到 /app/public/oes/assets/x.js，
        # 无需 alias/rewrite（alias 与 try_files/rewrite 有已知兼容问题，用子目录最干净）。
        location /oes/ {
            root /app/public;
            index index.html;
            try_files $uri $uri/ /oes/index.html;
        }
    }
}
