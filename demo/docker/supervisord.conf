# =============================================================================
# Umo Editor 瘦客户端示例进程管理配置（supervisor）
# -----------------------------------------------------------------------------
# 托管 2 个进程：
#   - demo-server （priority=10，最先起，:4001 文档元数据 + 代理签 JWT + 接收导出）
#   - nginx      （priority=20，依赖 demo-server）
# 日志全部输出到 stdout/stderr，docker logs 可见。
# =============================================================================

[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:demo-server]
command=node /app/server/index.js
directory=/app/server
# PORT/DB_PATH 固定；UMO_ENGINE_URL/UMO_API_KEY 从容器环境继承
environment=PORT="4001",DB_PATH="/app/server/data/docs.db"
autostart=true
autorestart=true
startsecs=2
startretries=5
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
