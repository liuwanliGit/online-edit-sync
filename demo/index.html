<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://s1.umodoc.com/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umo 文档中心</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- 运行时配置：普通 script 同步加载，保证 main.js 前 window.__UMO_CONFIG__ 就绪。
         用根绝对路径 /config.js：Vite 构建时会自动拼上 base 前缀（/oes/config.js），
         且深层路由刷新时不会随当前 URL 漂移（相对路径 ./config.js 在 /oes/documents/:id
         下会错误解析为 /oes/documents/config.js 导致 404）。 -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
